<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>oh-my-mermaid</title>
<script src="/vendor/dagre.js"></script>
<script src="/vendor/marked.js"></script>
<script src="/vendor/dompurify.js"></script>
<script src="/vendor/omm.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --bg: #000000;
  --border: #333333;
  --border-hi: #333;
  --text: #ffffff;
  --text-mid: #888;
  --text-dim: #555;
  --font: 'Inter', system-ui, -apple-system, sans-serif;
  --mono: 'SF Mono', 'Fira Code', monospace;
  --sidebar-w: 400px;
}
html, body { height: 100%; overflow: hidden; }
body { font-family: var(--font); background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

/* Nav sidebar */
#nav-sidebar {
  position: fixed; top: 0; left: 0; bottom: 0; width: 200px;
  background: #000; border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  z-index: 200;
}
#nav-title {
  padding: 14px 16px;
  font-size: 13px; font-weight: 600; color: #fff;
  font-family: var(--mono);
}
#nav-list {
  flex: 1; overflow-y: auto;
  scrollbar-width: thin; scrollbar-color: #1a1a1a transparent;
}
.nav-item {
  display: flex; align-items: center; width: 100%; height: 24px;
  padding: 0 16px 0 0;
  font-size: 11.5px; font-family: 'Geist Mono', 'JetBrains Mono', 'Fira Code', var(--mono);
  color: #666; cursor: pointer;
  border: none; background: none; text-align: left;
  transition: color .12s, background .12s;
  white-space: nowrap; overflow: hidden;
}
.nav-item.nav-root { color: #bbb; font-size: 12px; height: 28px; padding-left: 16px; margin-top: 2px; }
.nav-pre { display: flex; align-self: stretch; align-items: stretch; flex-shrink: 0; padding-left: 16px; }
.nav-slot { width: 12px; position: relative; flex-shrink: 0; }
.nav-slot-line::before {
  content: ''; position: absolute;
  left: 6px; top: 0; bottom: 0; width: 1px; background: #222;
}
.nav-conn { width: 18px; position: relative; flex-shrink: 0; }
.nav-conn::before {
  content: ''; position: absolute;
  left: 6px; top: 0; width: 1px; background: #2e2e2e;
}
.nav-conn:not(.nav-conn-last)::before { bottom: 0; }
.nav-conn-last::before { bottom: 50%; }
.nav-conn::after {
  content: ''; position: absolute;
  left: 6px; right: 0; top: 50%; height: 1px;
  transform: translateY(-50%); background: #2e2e2e;
}
.nav-label { flex: 1; overflow: hidden; text-overflow: ellipsis; }
.nav-item:hover { color: #fff; background: #0d0d0d; }
.nav-item:hover .nav-slot-line::before,
.nav-item:hover .nav-conn::before,
.nav-item:hover .nav-conn::after { background: #555; }
.nav-item.active { color: #fff; background: #141414; }
.nav-item.active .nav-slot-line::before,
.nav-item.active .nav-conn::before,
.nav-item.active .nav-conn::after { background: #555; }

/* Floating controls */
.float-controls {
  position: absolute; top: 12px; right: 12px;
  display: flex; align-items: center; gap: 3px;
  z-index: 100;
  background: rgba(0,0,0,0.7);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 6px;
  backdrop-filter: blur(8px);
}
.hbtn { background: none; border: 1px solid var(--border-hi); color: var(--text-mid); height: 26px; min-width: 26px; padding: 0 8px; border-radius: 5px; cursor: pointer; font-size: 13px; font-family: var(--font); transition: border-color .12s, color .12s; }
.hbtn:hover { border-color: #3a3a3a; color: var(--text); }
.hbtn.on { border-color: var(--text-mid); color: var(--text); }
.hbtn:focus-visible { outline: 2px solid #818cf8; outline-offset: 1px; }
.seg { display: inline-flex; }
.seg .hbtn:first-child { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.seg .hbtn:last-child { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: -1px; }
#zoom-label { font-size: 11px; color: var(--text-dim); width: 38px; text-align: center; font-family: var(--mono); }

#canvas-wrap {
  flex: 1; position: relative; overflow: hidden; cursor: grab; margin-left: 200px;
  background-color: var(--bg);
  background-image: radial-gradient(circle, #1a1a1a 1px, transparent 1px);
  background-size: 28px 28px;
  user-select: none;
}
#canvas-wrap.panning { cursor: grabbing; }
#canvas { position: absolute; transform-origin: 0 0; }
#canvas svg { display: block; overflow: visible; }

/* SVG interactive elements */
.grp-node { cursor: pointer; }
.grp-node .grp-border { transition: stroke .12s, filter .12s; }
.grp-node:hover > .grp-border { stroke: #ffffff !important; stroke-width: 2.5px; filter: drop-shadow(0 0 6px rgba(255,255,255,0.5)); }
.grp-node.selected > .grp-border { stroke: #818cf8 !important; stroke-width: 2.5px; stroke-dasharray: none !important; filter: drop-shadow(0 0 8px rgba(129,140,248,0.6)); }
.reg-node { cursor: pointer; }
.reg-node .nshape { transition: stroke .12s, filter .12s; }
.reg-node:hover .nshape { stroke: #ffffff !important; stroke-width: 2.5px; filter: drop-shadow(0 0 6px rgba(255,255,255,0.5)); }
/* Edge highlight on node hover */
/* Flow motion icons: never in the way of clicks; hidden where the content around them is */
.flow-icon { pointer-events: none; }
#canvas-wrap.zoom-overview .flow-icon { display: none; }
#canvas-wrap.zoom-overview [data-cls].focus-exempt > .grp-inner .flow-icon { display: inline; }
.grp-node.grp-collapsed:not(.focus-exempt) > .grp-inner .flow-icon { display: none; }
.hbtn:disabled { opacity: .45; cursor: not-allowed; }
.edge-path.edge-hl { stroke: #ffffff !important; stroke-width: 2.5px; opacity: 1; transition: all .15s; }
.reg-node.selected .nshape { stroke: #818cf8 !important; stroke-width: 2.5px; filter: drop-shadow(0 0 8px rgba(129,140,248,0.6)); }
/* Overview mode: per-element fade — borders + edges stay visible */
.grp-inner { transition: opacity .25s; }
/* Collapsed groups: dim inner content, show center label */
.grp-node.grp-collapsed > .grp-inner { opacity: 0.15; pointer-events: none; transition: opacity .25s; }
.grp-node.grp-collapsed > .grp-label-top { opacity: 0; transition: opacity .25s; }
.grp-node.grp-collapsed > .grp-label-bg { opacity: 0; transition: opacity .25s; }
/* Focus-exempt override for collapsed groups */
.grp-node.grp-collapsed.focus-exempt > .grp-inner { opacity: 1 !important; pointer-events: auto !important; }
.grp-node.grp-collapsed.focus-exempt > .grp-label-top { opacity: 1 !important; }
.grp-node.grp-collapsed.focus-exempt > .grp-label-bg { opacity: 1 !important; }
.grp-node.grp-collapsed.focus-exempt > .grp-label-center { display: none !important; }
#canvas-wrap.zoom-overview .grp-inner { pointer-events: none; }
#canvas-wrap.zoom-overview .grp-inner > .reg-node { opacity: 0.2; transition: opacity .25s; }
#canvas-wrap.zoom-overview .grp-inner .edge-path { opacity: 0.4; transition: opacity .25s; }
#canvas-wrap.zoom-overview .grp-inner .edge-label { opacity: 0; }
#canvas-wrap.zoom-overview .grp-inner > .grp-node > .grp-inner { opacity: 0.06; }
#canvas-wrap.zoom-overview .grp-inner > .grp-node > .grp-border { opacity: 0.60; }
#canvas-wrap.zoom-overview .grp-inner > .grp-node > .grp-label-top { opacity: 0; }
/* Top-level group labels */
.grp-label-center { display: none; }
#canvas-wrap.zoom-overview .grp-label-top { display: none; }
#canvas-wrap.zoom-overview .grp-label-center { display: block; }
/* Hide sub-group direct center labels in zoom-overview (labelOverlay handles these) */
#canvas-wrap.zoom-overview .grp-inner > .grp-node > .grp-label-center { display: none; }
/* Sub-group overlay labels (outside grp-inner — unaffected by opacity) */
.grp-sub-labels { display: none; pointer-events: none; }
.grp-sub-labels text { opacity: 0.45; }
/* Depth-aware labels: expanded groups hide center, show top-left */
.grp-node.grp-expanded > .grp-label-center { display: none; }
/* Center label only visible when collapsed (not merely non-expanded) */
.grp-node.grp-collapsed:not(.grp-expanded) > .grp-label-center { display: block; opacity: 0.85; }
/* Top-level expanded: hide center */
[data-cls].grp-expanded > .grp-label-center { display: none; }
#canvas-wrap.zoom-overview .grp-sub-labels { display: block; }
/* Focused group: restore full visibility */
#canvas-wrap.zoom-overview [data-cls].focus-exempt > .grp-inner { pointer-events: auto !important; }
#canvas-wrap.zoom-overview [data-cls].focus-exempt > .grp-inner > .reg-node { opacity: 1 !important; }
#canvas-wrap.zoom-overview [data-cls].focus-exempt > .grp-inner .edge-path { opacity: 1 !important; }
#canvas-wrap.zoom-overview [data-cls].focus-exempt > .grp-inner .edge-label { opacity: 1 !important; }
#canvas-wrap.zoom-overview [data-cls].focus-exempt > .grp-inner .grp-node .grp-inner { opacity: 1 !important; }
#canvas-wrap.zoom-overview [data-cls].focus-exempt > .grp-inner .grp-node .grp-border { opacity: 1 !important; }
#canvas-wrap.zoom-overview [data-cls].focus-exempt > .grp-inner .grp-node .grp-label-top { opacity: 1 !important; }
#canvas-wrap.zoom-overview [data-cls].focus-exempt .grp-label-top { display: block !important; }
#canvas-wrap.zoom-overview [data-cls].focus-exempt .grp-label-center { display: none !important; }
#canvas-wrap.zoom-overview [data-cls].focus-exempt > .grp-sub-labels { display: none !important; }

/* Sidebar */
#sidebar {
  position: fixed; top: 0; right: 0; bottom: 0; width: var(--sidebar-w);
  background: #000; border-left: 1px solid var(--border);
  transform: translateX(100%);
  transition: transform .22s cubic-bezier(.4,0,.2,1);
  z-index: 300; display: flex; flex-direction: column;
}
#sidebar.open { transform: translateX(0); }
#sb-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
#sb-title { flex: 1; font-size: 14px; font-weight: 600; color: #fff; font-family: var(--mono); }
#sb-close { background: none; border: none; color: var(--text-dim); cursor: pointer; font-size: 22px; line-height: 1; padding: 0; }
#sb-close:hover { color: #888; }
#sb-body { flex: 1; overflow-y: auto; scrollbar-width: thin; scrollbar-color: #1a1a1a transparent; }

.sb-diagram { padding: 16px; border-bottom: 1px solid var(--border); background: #030303; }
.sb-diagram svg { display: block; width: 100%; height: auto; overflow: visible; }
.sb-fields { padding: 16px 20px; }
.sb-sec { margin-bottom: 20px; }
.sb-sec-title { font-size: 9px; text-transform: uppercase; letter-spacing: .14em; color: #888; padding-bottom: 7px; border-bottom: 1px solid #1e1e1e; margin-bottom: 9px; font-weight: 600; }
.sb-sec-body { font-size: 12px; line-height: 1.72; color: #bbb; }
.sb-sec-body p { margin-bottom: 6px; }
.sb-sec-body ul, .sb-sec-body ol { padding-left: 16px; }
.sb-sec-body li { margin-bottom: 3px; }
.sb-sec-body code { background: #111; padding: 1px 5px; border-radius: 2px; font-size: 11px; color: #ccc; font-family: var(--mono); }
.sb-sec-body strong { color: #eee; }
.sb-concern .sb-sec-body { border-left: 2px solid #444; padding-left: 10px; }
.sb-meta-text { font-size: 10px; color: #777; line-height: 1.9; font-family: var(--mono); }
.sb-refs { display: flex; flex-direction: column; gap: 4px; }
.sb-ref { font-size: 11px; color: #999; padding: 5px 10px; background: #090909; border: 1px solid #1e1e1e; border-radius: 4px; cursor: pointer; display: block; font-family: var(--mono); transition: border-color .12s, color .12s; }
.sb-ref:hover { border-color: #333; color: #bbb; }
.empty-state { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); text-align: center; pointer-events: none; }
.empty-state p { font-size: 12px; color: #444; line-height: 1.9; }
/* Light mode */
body.light { --bg: #f0f0f0; --border: #ddd; --border-hi: #bbb; --text: #1a1a1a; --text-mid: #555; --text-dim: #aaa; }
body.light header { background: #fff; }
body.light #canvas-wrap { background-color: #f0f0f0; background-image: radial-gradient(circle, #ccc 1px, transparent 1px); }
body.light #sidebar { background: #fafafa; }
body.light #sb-body { scrollbar-color: #ddd transparent; }
body.light .hbtn { border-color: #ccc; color: #666; }
body.light .hbtn:hover { border-color: #aaa; color: #222; }
body.light .sb-diagram { background: #f5f5f5; }
body.light .sb-sec-title { color: #aaa; border-color: #ddd; }
body.light .sb-sec-body { color: #555; }
body.light .sb-sec-body code { background: #e5e5e5; color: #333; }
body.light .sb-sec-body strong { color: #222; }
body.light .sb-concern .sb-sec-body { border-color: #ccc; }
body.light .sb-meta-text { color: #999; }
body.light .sb-ref { background: #eee; border-color: #ddd; color: #555; }
body.light .sb-ref:hover { border-color: #aaa; color: #111; }
body.light .empty-state p { color: #bbb; }
body.light #nav-sidebar { background: #fff; }
body.light .nav-item { color: #999; }
body.light .nav-item.nav-root { color: #333; }
body.light .nav-slot-line::before { background: #ddd; }
body.light .nav-conn::before, body.light .nav-conn::after { background: #ddd; }
body.light .nav-item:hover { color: #000; background: #f5f5f5; }
body.light .nav-item:hover .nav-slot-line::before,
body.light .nav-item:hover .nav-conn::before,
body.light .nav-item:hover .nav-conn::after { background: #bbb; }
body.light .nav-item.active { color: #000; background: #ebebeb; }
body.light .nav-item.active .nav-slot-line::before,
body.light .nav-item.active .nav-conn::before,
body.light .nav-item.active .nav-conn::after { background: #bbb; }
body.light .float-controls { background: rgba(255,255,255,0.8); }
body.light .grp-node:hover > .grp-border { stroke: #000 !important; filter: drop-shadow(0 0 6px rgba(0,0,0,0.3)); }
body.light .grp-node.selected > .grp-border { stroke: #4f46e5 !important; filter: drop-shadow(0 0 8px rgba(79,70,229,0.4)); }
body.light .reg-node:hover .nshape { stroke: #000 !important; filter: drop-shadow(0 0 6px rgba(0,0,0,0.3)); }
body.light .reg-node.selected .nshape { stroke: #4f46e5 !important; filter: drop-shadow(0 0 8px rgba(79,70,229,0.4)); }
body.light .reg-node:hover .nshape { stroke: #000 !important; }
body.light .edge-path.edge-hl { stroke: #1a1a1a !important; }

#mobile-nav-btn { display: none; }
#mobile-overlay { display: none; }

/* Mobile responsive */
@media (max-width: 768px) {
  #nav-sidebar {
    transform: translateX(-100%);
    transition: transform .22s cubic-bezier(.4,0,.2,1);
    z-index: 500;
  }
  #nav-sidebar.mobile-open { transform: translateX(0); }
  #canvas-wrap { left: 0 !important; margin-left: 0 !important; }
  #mobile-nav-btn {
    display: flex; align-items: center; gap: 8px;
    position: fixed; top: 10px; left: 10px; z-index: 400;
    background: rgba(0,0,0,0.75); border: 1px solid #333;
    border-radius: 6px; padding: 6px 12px;
    color: #fff; font-size: 13px; font-family: var(--mono);
    cursor: pointer; backdrop-filter: blur(8px);
  }
  #mobile-nav-btn span { font-size: 16px; }
  #mobile-overlay {
    display: none; position: fixed; inset: 0; z-index: 450;
    background: rgba(0,0,0,0.5);
  }
  #mobile-overlay.show { display: block; }
  #sidebar {
    top: auto; right: 0; bottom: 0; left: 0;
    width: 100%; height: 50vh;
    max-height: 70vh;
    border-left: none; border-top: 1px solid var(--border);
    border-radius: 12px 12px 0 0;
    transform: translateY(100%);
  }
  #sidebar.open { transform: translateY(0); }
  #sb-head {
    position: relative;
    padding: 12px 20px 10px;
  }
  #sb-head::before {
    content: '';
    position: absolute;
    top: 6px; left: 50%;
    transform: translateX(-50%);
    width: 36px; height: 4px;
    background: #444; border-radius: 2px;
  }
  .float-controls { display: none; }
}
</style>
</head>
<body>
<div id="nav-sidebar">
  <div id="nav-title">omm</div>
  <div id="nav-list"></div>
</div>

<div id="mobile-nav-btn" onclick="toggleMobileNav()"><span>☰</span><span id="mobile-title">omm</span></div>
<div id="mobile-overlay" onclick="toggleMobileNav()"></div>
<div id="canvas-wrap">
  <div class="float-controls">
    <button class="hbtn" onclick="zoomOut()">−</button>
    <span id="zoom-label">70%</span>
    <button class="hbtn" onclick="zoomIn()">+</button>
    <button class="hbtn" onclick="resetView()" style="font-size:11px">fit</button>
    <span id="color-mode" class="seg" role="group" aria-label="Diagram colors" title="Diagram colors: monochrome, or colors that show what each element is">
      <button class="hbtn" data-mode="monochrome" aria-pressed="true" onclick="setColorMode('monochrome')" style="font-size:11px">mono</button><button class="hbtn" data-mode="color" aria-pressed="false" onclick="setColorMode('color')" style="font-size:11px">color</button>
    </span>
    <button class="hbtn" id="clean-btn" onclick="toggleClean()" title="Clean view: hide file paths under element names" style="font-size:11px">clean</button>
    <button class="hbtn" id="flow-btn" onclick="toggleFlow()" aria-pressed="false" title="Flow: a file icon moves along the edges that carry data or work" style="font-size:11px">flow</button>
    <button class="hbtn" onclick="exportDiagram('svg')" title="Download the selected perspective (or everything) as SVG" style="font-size:11px">svg</button>
    <button class="hbtn" onclick="exportDiagram('png')" title="Download the selected perspective (or everything) as PNG" style="font-size:11px">png</button>
    <button class="hbtn" id="theme-btn" onclick="toggleTheme()" style="font-size:13px">○</button>
  </div>
  <div id="canvas"></div>
</div>

<div id="sidebar">
  <div id="sb-head"><div id="sb-title"></div><button id="sb-close" onclick="closeSidebar()">×</button></div>
  <div id="sb-body">
    <div class="sb-diagram" id="sb-diagram"></div>
    <div class="sb-fields" id="sb-fields"></div>
  </div>
</div>

<script type="module">
// ── theme ─────────────────────────────────────────────────
function safeStorageGet(key) {
  try {
    return localStorage.getItem(key);
  } catch {
    return null;
  }
}
function safeStorageSet(key, value) {
  try {
    localStorage.setItem(key, value);
  } catch {}
}
let isDark = safeStorageGet('omm-theme') !== 'light';
function applyTheme() {
  document.body.classList.toggle('light', !isDark);
  const btn = document.getElementById('theme-btn');
  if (btn) btn.textContent = isDark ? '○' : '●';
}
window.toggleTheme = function() {
  isDark = !isDark;
  safeStorageSet('omm-theme', isDark ? 'dark' : 'light');
  applyTheme();
  rebuildCanvas();
};

// Clean view (for showing diagrams to people who do not need the code): hides the
// file-path line omm-scan writes under element names
let cleanView = safeStorageGet('omm-clean') === '1';
function applyClean() {
  document.getElementById('clean-btn')?.classList.toggle('on', cleanView);
}
window.toggleClean = function() {
  cleanView = !cleanView;
  safeStorageSet('omm-clean', cleanView ? '1' : '0');
  applyClean();
  rebuildCanvas();
};

// Flow motion (for explaining how data or work moves): a small file icon travels along the
// edges that stand for movement; which ones is decided in src/lib/flow-motion.ts. Off by
// default, always off when the system asks for reduced motion, and never part of an export.
let flowMotion = safeStorageGet('omm-flow') === '1';
const reducedMotion = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
const motionOn = () => flowMotion && !reducedMotion?.matches;
function applyFlowMotion() {
  const btn = document.getElementById('flow-btn');
  if (!btn) return;
  const blocked = !!reducedMotion?.matches;
  btn.classList.toggle('on', motionOn());
  btn.setAttribute('aria-pressed', motionOn() ? 'true' : 'false');
  btn.disabled = blocked;
  btn.title = blocked
    ? 'Flow animation is off because your system asks for reduced motion'
    : 'Flow: a file icon moves along the edges that carry data or work';
}
window.toggleFlow = function() {
  if (reducedMotion?.matches) return;
  flowMotion = !flowMotion;
  safeStorageSet('omm-flow', flowMotion ? '1' : '0');
  applyFlowMotion();
  rebuildCanvas();
};
reducedMotion?.addEventListener?.('change', () => { applyFlowMotion(); rebuildCanvas(); });
// No animation work while the tab is hidden
document.addEventListener('visibilitychange', () => {
  const svg = document.querySelector('#canvas svg');
  if (svg?.pauseAnimations) document.hidden ? svg.pauseAnimations() : svg.unpauseAnimations();
});

// Diagram colors: 'monochrome' (default, the original look) or 'color' (semantic colors from
// src/lib/palette.ts). Independent of the light/dark theme; remembered per browser.
let colorMode = safeStorageGet('omm-diagram-colors') === 'color' ? 'color' : 'monochrome';
function applyColorMode() {
  document.querySelectorAll('#color-mode [data-mode]').forEach(b => {
    const on = b.dataset.mode === colorMode;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
}
window.setColorMode = function(mode) {
  if (mode !== 'color' && mode !== 'monochrome') return;
  if (mode === colorMode) return;
  colorMode = mode;
  safeStorageSet('omm-diagram-colors', mode);
  applyColorMode();
  rebuildCanvas();
};
function theme() {
  const edge = OmmViewer.edgeColors(isDark ? 'dark' : 'light');
  const edges = { edgeColor0: edge.line, edgeLabelBg: edge.labelBg, edgeLabelText: edge.labelText, iconFill: edge.iconFill, iconOutline: edge.iconOutline };
  return isDark ? {
    groupFill:'#0a0a0a', groupStroke:'#666666',
    subFill:'#111111', subStroke:'#666666', subLabelFill:'#ffffff',
    edgeColor1:'#787878', ...edges,
    grpLabelFill:'#ffffff', grpLabelCenterFill:'#dddddd',
  } : {
    groupFill:'#f8f8f8', groupStroke:'#bbb',
    subFill:'#efefef', subStroke:'#bbb', subLabelFill:'#888',
    edgeColor1:'#bbb', ...edges,
    grpLabelFill:'#475569', grpLabelCenterFill:'#222',
  };
}

// ── helpers ──────────────────────────────────────────────
const _tm = document.createElement('canvas').getContext('2d');
function tw(t, f) { _tm.font = f || '11px Inter,system-ui'; return Math.ceil(_tm.measureText(t).width); }
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function r1(n) { return +n.toFixed(1); }
function fmtLabel(s) { return s.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' '); }

// ── flowchart parsing (src/lib/flowchart.ts, shared with omm validate / omm diff) ──
function parseFlowchart(raw) {
  const fc = OmmViewer.parseFlowchart(raw);
  return { rankdir: fc.direction, nodes: [...fc.nodes.values()], edges: fc.edges, subgraphs: fc.subgraphs, errors: fc.errors };
}

// ── flowchart node shapes ─────────────────────────────────
const FLOW_FONT = '12px Inter,system-ui', FLOW_PATH_FONT = "9px 'SF Mono','Fira Code',monospace", FLOW_LINE_H = 15;

function wrapWords(text, font, maxW) {
  const out = []; let cur = '';
  for (const w of text.split(/\s+/).filter(Boolean)) {
    const next = cur ? cur + ' ' + w : w;
    if (cur && tw(next, font) > maxW) { out.push(cur); cur = w; } else cur = next;
  }
  if (cur) out.push(cur);
  return out.length ? out : [''];
}

// Label lines (wrapped to maxW) and the detail line omm-scan writes after "\n" (usually a path)
function flowLabel(n, maxW) {
  const lines = n.label.replace(/^@/, '').split('\n').flatMap(l => wrapWords(l.trim(), FLOW_FONT, maxW));
  return { lines, path: cleanView ? null : (n.detail || null) };
}

// Box size for a node: text plus the room its shape needs
function flowNodeSize(n, maxW) {
  if (n.shape === 'small-circle') return { width: 18, height: 18, text: { lines: [], path: null } };
  const textMax = n.shape === 'diamond' ? Math.min(130, maxW - 44) : maxW - 44;
  const text = flowLabel(n, textMax);
  const textW = Math.max(...text.lines.map(l => tw(l, FLOW_FONT)), text.path ? tw(text.path, FLOW_PATH_FONT) : 0);
  const textH = text.lines.length * FLOW_LINE_H + (text.path ? 14 : 0);
  let width = Math.min(maxW, Math.max(80, textW + 44)), height = textH + 23;
  switch (n.shape) {
    case 'diamond':       width = Math.max(90, (textW + 16) / 0.6); height = Math.max(42, (textH + 6) / 0.45); break;
    case 'circle':        width = height = Math.max(36, Math.max(textW, textH) + 20); break;
    case 'double-circle': width = height = Math.max(44, Math.max(textW, textH) + 28); break;
    case 'stadium': case 'asymmetric': width += height * 0.3; break;
    case 'lean-right': case 'lean-left': case 'trapezoid': case 'trapezoid-alt': width += height * 0.6; break;
    case 'hexagon':       width += height * 0.5; break;
    case 'subroutine':    width += 16; break;
    case 'cylinder':      height += 12; break;
    case 'document':      height += 8; break;
  }
  return { width, height, text };
}

// SVG outline of a node shape at (x, y) with size w × h
function flowShapeSvg(shape, x, y, w, h, st) {
  const a = `class="nshape" fill="${st.bg}" stroke="${st.border}" stroke-width="2" ${st.dash ? `stroke-dasharray="${st.dash}"` : ''}`;
  const X = r1(x), Y = r1(y), R = r1(x + w), B = r1(y + h), CX = r1(x + w / 2), CY = r1(y + h / 2);
  const poly = pts => `<polygon ${a} points="${pts.map(p => p.map(r1).join(',')).join(' ')}"/>`;
  const s = h * 0.3;
  switch (shape) {
    case 'diamond':       return poly([[x + w / 2, y], [x + w, y + h / 2], [x + w / 2, y + h], [x, y + h / 2]]);
    case 'stadium':       return `<rect ${a} x="${X}" y="${Y}" width="${r1(w)}" height="${r1(h)}" rx="${r1(h / 2)}"/>`;
    case 'round':         return `<rect ${a} x="${X}" y="${Y}" width="${r1(w)}" height="${r1(h)}" rx="10"/>`;
    case 'circle':        return `<circle ${a} cx="${CX}" cy="${CY}" r="${r1(w / 2)}"/>`;
    case 'small-circle':  return `<circle ${a} cx="${CX}" cy="${CY}" r="${r1(w / 2)}" style="fill:${st.border}"/>`;
    case 'double-circle': return `<circle ${a} cx="${CX}" cy="${CY}" r="${r1(w / 2)}"/><circle cx="${CX}" cy="${CY}" r="${r1(w / 2 - 4)}" fill="none" stroke="${st.border}" stroke-width="1.5"/>`;
    case 'lean-right':    return poly([[x + s, y], [x + w, y], [x + w - s, y + h], [x, y + h]]);
    case 'lean-left':     return poly([[x, y], [x + w - s, y], [x + w, y + h], [x + s, y + h]]);
    case 'trapezoid':     return poly([[x + s, y], [x + w - s, y], [x + w, y + h], [x, y + h]]);
    case 'trapezoid-alt': return poly([[x, y], [x + w, y], [x + w - s, y + h], [x + s, y + h]]);
    case 'hexagon':       { const k = h / 4; return poly([[x + k, y], [x + w - k, y], [x + w, y + h / 2], [x + w - k, y + h], [x + k, y + h], [x, y + h / 2]]); }
    case 'asymmetric':    return poly([[x, y], [x + w, y], [x + w, y + h], [x, y + h], [x + s, y + h / 2]]);
    case 'subroutine':    return `<rect ${a} x="${X}" y="${Y}" width="${r1(w)}" height="${r1(h)}" rx="2"/>
      <path d="M${r1(x + 8)},${Y} V${B} M${r1(x + w - 8)},${Y} V${B}" stroke="${st.border}" stroke-width="1.5" fill="none"/>`;
    case 'cylinder': {
      const ry = 6;
      return `<path ${a} d="M${X},${r1(y + ry)} A${r1(w / 2)},${ry} 0 0 1 ${R},${r1(y + ry)} V${r1(y + h - ry)} A${r1(w / 2)},${ry} 0 0 1 ${X},${r1(y + h - ry)} Z"/>
      <path d="M${X},${r1(y + ry)} A${r1(w / 2)},${ry} 0 0 0 ${R},${r1(y + ry)}" stroke="${st.border}" stroke-width="1.5" fill="none"/>`;
    }
    case 'document': {
      const wy = y + h - 6;
      return `<path ${a} d="M${X},${Y} H${R} V${r1(wy)} C${r1(x + w * 0.75)},${r1(wy - 10)} ${r1(x + w * 0.5)},${r1(wy + 12)} ${r1(x + w * 0.25)},${r1(wy + 2)} S${r1(x + w * 0.05)},${r1(wy - 4)} ${X},${r1(wy)} Z"/>`;
    }
    default:              return `<rect ${a} x="${X}" y="${Y}" width="${r1(w)}" height="${r1(h)}" rx="4"/>`;
  }
}

// Point where the line from the centre c of a w×h box towards p leaves the box
function boxEdge(c, p, w, h) {
  const dx = p.x - c.x, dy = p.y - c.y;
  if (!dx && !dy) return c;
  const t = Math.min(dx ? (w / 2) / Math.abs(dx) : Infinity, dy ? (h / 2) / Math.abs(dy) : Infinity);
  return { x: c.x + dx * t, y: c.y + dy * t };
}

// True when the segment a→b passes through the w×h box centred on c (with a small margin)
function segmentHitsBox(a, b, c, w, h) {
  const x0 = c.x - w / 2 - 2, x1 = c.x + w / 2 + 2, y0 = c.y - h / 2 - 2, y1 = c.y + h / 2 + 2;
  let t0 = 0, t1 = 1;
  const dx = b.x - a.x, dy = b.y - a.y;
  for (const [p, q] of [[-dx, a.x - x0], [dx, x1 - a.x], [-dy, a.y - y0], [dy, y1 - a.y]]) {
    if (!p) { if (q < 0) return false; continue; }
    const t = q / p;
    if (p < 0) t0 = Math.max(t0, t); else t1 = Math.min(t1, t);
    if (t0 > t1) return false;
  }
  return true;
}

// Move an edge end from the layout box onto the outline of a diamond or circle
function clipToShape(p, c, w, h, shape) {
  const dx = p.x - c.x, dy = p.y - c.y;
  if (!dx && !dy) return p;
  let t;
  if (shape === 'diamond') t = 1 / (Math.abs(dx) / (w / 2) + Math.abs(dy) / (h / 2));
  else if (shape === 'circle' || shape === 'double-circle' || shape === 'small-circle') t = (w / 2) / Math.hypot(dx, dy);
  else return p;
  return { x: c.x + dx * t, y: c.y + dy * t };
}

// Label text inside a node, centred on (cx, cy). One <text> with em-spaced lines, so the
// zoom code that enlarges .node-lbl when zoomed out keeps the lines apart.
function flowLabelSvg(text, cx, cy, st, shape) {
  if (!text.lines.length) return '';
  const shift = (shape === 'document' ? -3 : 0) + (shape === 'cylinder' ? 4 : 0);
  const textY = cy + shift - (text.path ? 7 : 0);
  const first = -(text.lines.length - 1) * 0.625;
  const spans = text.lines.map((l, i) => `<tspan x="${r1(cx)}" dy="${i ? 1.25 : r1(first)}em">${esc(l)}</tspan>`).join('');
  let out = `<text class="node-lbl" x="${r1(cx)}" y="${r1(textY)}" text-anchor="middle" dominant-baseline="central"
    font-family="Inter,system-ui,sans-serif" font-size="12" fill="${st.text}">${spans}</text>`;
  if (text.path) {
    const pathY = cy + shift + (text.lines.length * FLOW_LINE_H) / 2;
    out += `<text class="node-path" x="${r1(cx)}" y="${r1(pathY)}" text-anchor="middle" dominant-baseline="central"
      font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="${st.text}" opacity="0.45">${esc(text.path)}</text>`;
  }
  return out;
}

// Arrowhead marker, the same size in every diagram type. `open` draws the line-only
// head that sequence diagrams use for async messages.
const ARROW_W = 10, ARROW_H = 8;
function arrowMarker(id, color, open = false) {
  const head = open
    ? `<path d="M1,1 L${ARROW_W - 1},${ARROW_H / 2} L1,${ARROW_H - 1}" fill="none" stroke="${color}" stroke-width="1.5"/>`
    : `<path d="M0,0 L${ARROW_W},${ARROW_H / 2} L0,${ARROW_H} z" fill="${color}"/>`;
  return `<marker id="${id}" markerWidth="${ARROW_W}" markerHeight="${ARROW_H}" refX="${ARROW_W - 1}" refY="${ARROW_H / 2}" orient="auto-start-reverse" markerUnits="userSpaceOnUse">${head}</marker>`;
}

// Arrow-end markers for flowchart edges: arrow, circle and cross
function flowMarkerDefs(id, color) {
  return `<defs>
    ${arrowMarker(id + 'arrow', color)}
    <marker id="${id}circle" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><circle cx="5" cy="5" r="4" fill="none" stroke="${color}" stroke-width="1.5"/></marker>
    <marker id="${id}cross" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto-start-reverse" markerUnits="userSpaceOnUse"><path d="M1,1 L9,9 M9,1 L1,9" stroke="${color}" stroke-width="1.5"/></marker>
  </defs>`;
}

// ── flow motion icons ─────────────────────────────────────
// <animateMotion> moves the icon along the edge's own path (referenced by id), so it follows
// every curve, goes from source to target, and scales with zoom. No timers are involved.
let iconBudget = 0; // icons left in the render in progress; 0 when motion is off or exporting

function flowIcon(th, scale = 1) {
  const s = n => r1(n * scale);
  return `<path d="M${s(-5)},${s(-6.5)} H${s(1.5)} L${s(5)},${s(-3)} V${s(6.5)} H${s(-5)} Z" fill="${th.iconFill}" stroke="${th.iconOutline}" stroke-width="1.2" stroke-linejoin="round"/>`
    + `<path d="M${s(1.5)},${s(-6.5)} V${s(-3)} H${s(5)}" fill="none" stroke="${th.iconOutline}" stroke-width="1"/>`;
}

// Approximate length of the drawn path through these waypoints
function polyLength(pts) {
  let len = 0;
  for (let i = 1; i < pts.length; i++) len += Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y);
  return len;
}

// SMIL key times must not repeat: drop an entry when the next one has the same time
function keyed(times, values) {
  const t = [], v = [];
  times.forEach((x, i) => { if (i + 1 < times.length && times[i + 1] <= x) return; t.push(x.toFixed(4)); v.push(values[i]); });
  return { keyTimes: t.join(';'), values: v.join(';') };
}

// One icon on the path `pathId` (about `len` long). In each cycle of `cycle` seconds it is
// visible and moving between the fractions `from` and `to` of the cycle, hidden otherwise.
// It starts `start` px into the path and stops before the arrowhead.
function flowIconSvg(pathId, len, { cycle, from = 0, to, delay = 0, start = 0, scale = 1 }) {
  if (iconBudget <= 0 || !(len > 0)) return '';
  iconBudget--;
  const M = OmmViewer.FLOW_MOTION;
  const p0 = Math.min(start / len, 0.4);
  const p1 = Math.min(1, Math.max(p0 + 0.2, (len - M.stopBefore) / len));
  const fade = Math.min(0.03, (to - from) / 5);
  const move = keyed([0, from, to, 1], [p0, p0, p1, p1].map(p => p.toFixed(4)));
  const show = keyed([0, from, from + fade, to - fade, to, 1], [0, 0, 1, 1, 0, 0]);
  const timing = `dur="${r1(cycle)}s" begin="${r1(delay)}s" repeatCount="indefinite" calcMode="linear"`;
  return `<g class="flow-icon" opacity="0">${flowIcon(theme(), scale)}`
    + `<animateMotion ${timing} keyTimes="${move.keyTimes}" keyPoints="${move.values}"><mpath href="#${pathId}"/></animateMotion>`
    + `<animate attributeName="opacity" ${timing} keyTimes="${show.keyTimes}" values="${show.values}"/></g>`;
}

// Icon for a flowchart edge: one trip, then a pause; edges start at staggered times
function flowEdgeIcon(pathId, pts, speed, i) {
  const M = OmmViewer.FLOW_MOTION;
  const len = polyLength(pts);
  const trip = OmmViewer.tripSeconds(len, speed);
  const cycle = trip + M.pause;
  return flowIconSvg(pathId, len, { cycle, to: trip / cycle, delay: (i * 0.45) % cycle, scale: 1.2 });
}

// ── node style ────────────────────────────────────────────
// Colors come from src/lib/palette.ts. In monochrome mode the role is ignored and the
// original styles are returned; in color mode the role (or the node's category class) picks them.
function nodeStyle(node, role = 'neutral') {
  return OmmViewer.nodeColors(colorMode, isDark ? 'dark' : 'light', role, node.cls);
}

// ── smooth path through all Dagre waypoints ───────────────
// Uses quadratic bezier spline so edges respect Dagre's obstacle routing
function smoothPath(pts) {
  if (!pts || pts.length < 2) return '';
  if (pts.length === 2) {
    // Simple S-curve for two-point edges, leaving and entering along the main direction
    const [a, b] = pts;
    const mx = r1((a.x+b.x)/2), my = r1((a.y+b.y)/2);
    if (Math.abs(b.y - a.y) > Math.abs(b.x - a.x)) return `M${r1(a.x)},${r1(a.y)} C${r1(a.x)},${my} ${r1(b.x)},${my} ${r1(b.x)},${r1(b.y)}`;
    return `M${r1(a.x)},${r1(a.y)} C${mx},${r1(a.y)} ${mx},${r1(b.y)} ${r1(b.x)},${r1(b.y)}`;
  }
  // Quadratic bezier spline: smooth through all waypoints
  let d = `M${r1(pts[0].x)},${r1(pts[0].y)}`;
  for (let i = 1; i < pts.length - 1; i++) {
    const mid = { x: (pts[i].x + pts[i+1].x) / 2, y: (pts[i].y + pts[i+1].y) / 2 };
    d += ` Q${r1(pts[i].x)},${r1(pts[i].y)} ${r1(mid.x)},${r1(mid.y)}`;
  }
  const last = pts[pts.length-1];
  d += ` L${r1(last.x)},${r1(last.y)}`;
  return d;
}

// ── render one class group (recursive) ────────────────────
// _expandedGlobal prevents same class from expanding in multiple branches
let _expandedGlobal = new Set();

function renderGroup(cls, classesData, allClasses, level, seen = new Set(), scopedPath) {
  if (seen.has(cls)) return null;
  seen = new Set(seen); seen.add(cls);
  if (!scopedPath) scopedPath = cls; // level 0: scopedPath = perspective name
  let labelOverlay = ''; // centered labels for sub-groups, rendered outside grp-inner

  const data = classesData[cls];
  if (!data?.diagram) return null;

  const diagramType = window.OmmViewer ? OmmViewer.detectDiagramType(data.diagram) : 'flowchart';
  if (diagramType === 'er') return renderErGroup(data.diagram, scopedPath);
  if (diagramType === 'sequence') return renderSeqGroup(data.diagram, scopedPath);
  if (diagramType === 'state') return renderStateGroup(data.diagram, scopedPath);
  if (diagramType === 'architecture') return renderArchGroup(data.diagram, scopedPath);

  const parsed = parseFlowchart(data.diagram);
  const {rankdir, nodes, subgraphs} = parsed;
  if (!nodes.length) return null;
  const processFlowchart = OmmViewer.isProcessFlowchart(nodes.map(n => n.shape));

  // Lanes (subgraphs) that contain at least one node, directly or through a nested lane
  const laneOf = id => nodes.find(n => n.id === id)?.subgraph;
  const inLane = (sgId, laneId) => { for (let s = sgId; s; s = subgraphs.get(s)?.parent) if (s === laneId) return true; return false; };
  const lanes = [...subgraphs.values()].filter(sg => nodes.some(n => inLane(n.subgraph, sg.id)));
  // An edge to a lane is drawn to the lane's first node (dagre cannot route edges to a lane box)
  const laneTarget = id => subgraphs.has(id) && !nodes.some(n => n.id === id) ? nodes.find(n => inLane(n.subgraph, id))?.id : id;
  const edges = parsed.edges
    .map(e => ({ ...e, from: laneTarget(e.from), to: laneTarget(e.to), toLane: e.from !== laneTarget(e.from) || e.to !== laneTarget(e.to) }))
    .filter(e => e.from && e.to && !(e.toLane && e.from === e.to));

  // padding around the group content
  const PAD_L = 16, PAD_R = 20, PAD_T = 20, PAD_B = 16;

  // For level 0: expand @ref nodes as sub-groups
  const subGroups = {}; // nodeId -> { cls, W, H, svgContent }
  const nodeDims  = {}; // nodeId -> { width, height }

  // Determine children of current element for subgroup resolution
  const currentChildren = (level === 0 ? (childrenByPerspective[cls] || []) : (classesData[cls]?.children || []));

  for (const n of nodes) {
    // Resolve subgroup: @ref (legacy) OR node ID is a child of current element with its own diagram
    const refCls = n.isRef ? (n.refTarget || n.id) : (currentChildren.includes(n.id) && classesData[n.id]?.diagram ? n.id : null);
    if (level < maxDepth && refCls && classesData[refCls]?.diagram && !seen.has(refCls) && !_expandedGlobal.has(refCls)) {
      _expandedGlobal.add(refCls);
      const childScopedPath = scopedPath + '/' + refCls;
      const sub = renderGroup(refCls, classesData, allClasses, level+1, seen, childScopedPath);
      if (sub) {
        // Scale down to fit max box. At small scales, edge overflow becomes negligible.
        const MAX_W = 320, MAX_H = 220, PAD = 12;
        const fs = Math.min((MAX_W - PAD*2) / sub.W, (MAX_H - PAD*2) / sub.H, 1);
        subGroups[n.id] = { cls: refCls, scopedPath: childScopedPath, ...sub, fitScale: fs };
        nodeDims[n.id] = { width: sub.W * fs + PAD * 2, height: sub.H * fs + PAD * 2 };
      }
    }
    if (!nodeDims[n.id]) nodeDims[n.id] = flowNodeSize(n, nodes.length > 10 ? 160 : 220);
  }

  // Pre-process: identify fan-out groups for compact grid layout
  const maxPerRow = 3;
  const _gridGroups = {};  // virtualId -> { parentId, children[], cols, cellW, cellH }
  const _gridExcluded = new Set();  // node IDs replaced by virtual nodes
  const _gridPositions = {};  // childId -> { x, y } (filled after dagre)

  for (const n of (lanes.length ? [] : nodes)) { // no grids inside lanes
    const outEdges = edges.filter(e => e.from === n.id);
    const leafTargets = outEdges
      .map(e => e.to)
      .filter(tid => !edges.some(e2 => e2.from === tid) && !subGroups[tid]);
    if (leafTargets.length > maxPerRow) {
      const cols = maxPerRow;
      const rows = Math.ceil(leafTargets.length / cols);
      const maxCW = Math.max(...leafTargets.map(id => nodeDims[id].width));
      const maxCH = Math.max(...leafTargets.map(id => nodeDims[id].height));
      const cellW = maxCW + 16;
      const cellH = maxCH + 10;
      const vid = `__grid_${n.id}`;
      _gridGroups[vid] = { parentId: n.id, children: leafTargets, cols, cellW, cellH };
      nodeDims[vid] = { width: cols * cellW, height: rows * cellH };
      leafTargets.forEach(id => _gridExcluded.add(id));
    }
  }

  // Dagre layout with virtual grid nodes
  const dense = nodes.length > 10;
  // Edge labels get space in the layout so they do not sit on top of nodes
  const edgeLabelSize = e => e.label ? { width: tw(e.label, '10px Inter') + 10, height: 14, labelpos: 'c' } : {};
  function buildGraph(rd) {
    const g = new dagre.graphlib.Graph({ multigraph: true, compound: lanes.length > 0 });
    const nsep = dense ? 20 : 32;
    const rsep = dense ? 28 : 44;
    g.setGraph({rankdir: rd, nodesep:nsep, ranksep:rsep, marginx:PAD_L, marginy:PAD_T});
    g.setDefaultEdgeLabel(() => ({}));
    for (const n of nodes) {
      if (!_gridExcluded.has(n.id)) g.setNode(n.id, { width: nodeDims[n.id].width, height: nodeDims[n.id].height });
    }
    for (const sg of lanes) g.setNode('__lane_' + sg.id, {});
    for (const sg of lanes) if (sg.parent && lanes.includes(subgraphs.get(sg.parent))) g.setParent('__lane_' + sg.id, '__lane_' + sg.parent);
    for (const n of nodes) if (n.subgraph && g.hasNode('__lane_' + n.subgraph)) g.setParent(n.id, '__lane_' + n.subgraph);
    for (const vid of Object.keys(_gridGroups)) g.setNode(vid, nodeDims[vid]);
    const _addedVirtEdges = new Set();
    edges.forEach((e, i) => {
      let from = e.from, to = e.to;
      if (_gridExcluded.has(from)) return;
      if (_gridExcluded.has(to)) {
        const vEntry = Object.entries(_gridGroups).find(([,gr]) => gr.children.includes(to));
        if (!vEntry) return;
        to = vEntry[0];
        const ek = `${from}->${to}`;
        if (_addedVirtEdges.has(ek)) return;
        _addedVirtEdges.add(ek);
        if (g.hasNode(from)) g.setEdge(from, to, { minlen: e.length || 1 }, 'e' + i);
        return;
      }
      if (g.hasNode(from) && g.hasNode(to)) g.setEdge(from, to, { ...edgeLabelSize(e), minlen: e.length || 1 }, 'e' + i);
    });
    try { dagre.layout(g); return g; } catch { return null; }
  }

  let g = buildGraph(rankdir);
  if (!g) return null;
  const gi0 = g.graph();
  const aspectThreshold = nodes.length > 12 ? 1.4 : nodes.length > 7 ? 1.6 : 2.0;
  if (gi0.width > 0 && gi0.height > 0 && gi0.width / gi0.height > aspectThreshold && rankdir !== 'TB') {
    const gTB = buildGraph('TB');
    if (gTB) g = gTB;
  }

  // Expand virtual grid nodes into child positions
  for (const [vid, group] of Object.entries(_gridGroups)) {
    const vNode = g.node(vid);
    if (!vNode) continue;
    const { children, cols, cellW, cellH } = group;
    const rows = Math.ceil(children.length / cols);
    const startX = vNode.x - ((cols - 1) * cellW) / 2;
    const startY = vNode.y - ((rows - 1) * cellH) / 2;
    children.forEach((childId, i) => {
      _gridPositions[childId] = {
        x: startX + (i % cols) * cellW,
        y: startY + Math.floor(i / cols) * cellH
      };
    });
  }

  const gi = g.graph();
  const W = r1(gi.width + PAD_R);
  const H = r1(gi.height + PAD_B);

  const uid = `${cls.replace(/[^a-z0-9]/gi,'')}_l${level}_`;
  const th = theme();
  let svg = '';

  // lanes (subgraphs): outer lanes first so nested ones draw on top
  const laneDepth = sg => { let d = 0; for (let s = sg.parent; s; s = subgraphs.get(s)?.parent) d++; return d; };
  for (const sg of [...lanes].sort((a, b) => laneDepth(a) - laneDepth(b))) {
    const box = g.node('__lane_' + sg.id);
    if (!box?.width) continue;
    const lx = r1(box.x - box.width / 2), ly = r1(box.y - box.height / 2);
    const lw = tw(sg.label, '600 10px Inter,system-ui') + 14;
    svg += `<g class="flow-lane" data-lane="${esc(sg.id)}">
      <rect x="${lx}" y="${ly}" width="${r1(box.width)}" height="${r1(box.height)}" rx="8" fill="${laneDepth(sg) % 2 ? th.groupFill : th.subFill}" stroke="${th.subStroke}" stroke-width="1.5" stroke-dasharray="6,4"/>
      <rect x="${r1(lx + 10)}" y="${r1(ly - 8)}" width="${r1(lw)}" height="16" rx="3" fill="${th.subFill}" stroke="${th.subStroke}" stroke-width="1"/>
      <text x="${r1(lx + 17)}" y="${r1(ly)}" dominant-baseline="central" font-family="Inter,system-ui" font-size="10" font-weight="600" fill="${th.subLabelFill}">${esc(sg.label)}</text>
    </g>`;
  }

  // edges
  const ec = th.edgeColor0;
  svg += flowMarkerDefs(uid, ec);
  const shapeEnd = (p, c, id) => {
    const n = nodes.find(x => x.id === id);
    return n && !subGroups[id] ? clipToShape(p, c, nodeDims[id].width, nodeDims[id].height, n.shape) : p;
  };
  // Unlabelled edges between the same two nodes get the same route from dagre; spread them apart
  const pairKey = e => [e.from, e.to].sort().join('\u0000');
  const parallel = {};
  for (const e of edges) if (!e.label && e.style !== 'invisible') (parallel[pairKey(e)] ||= []).push(e);
  let edgeLabels = ''; // drawn after every edge, so no line runs over a label
  let edgeIcons = '';  // moving icons: above the lines, below labels and elements
  edges.forEach((e,i) => {
    if (_gridExcluded.has(e.from)) return; // skip edges from grid children
    if (e.style === 'invisible') return;   // ~~~ only affects layout
    let pts, d, mid;
    const srcPos = g.node(e.from) || _gridPositions[e.from];
    const tgtPos = _gridPositions[e.to] || g.node(e.to);
    if (!srcPos || !tgtPos) return;
    if (_gridPositions[e.to]) {
      // Edge to grid child: a direct line between the two boxes, unless that line would cross
      // another child. Then it runs along the gap left of the child's column and enters from the side.
      const grid = Object.values(_gridGroups).find(gr => gr.children.includes(e.to));
      const tw_ = nodeDims[e.to].width, th_ = nodeDims[e.to].height;
      const b = boxEdge(tgtPos, srcPos, tw_, th_);
      const a = boxEdge(srcPos, tgtPos, nodeDims[e.from].width, nodeDims[e.from].height);
      const blocked = grid.children.some(id => id !== e.to && segmentHitsBox(a, b, _gridPositions[id], nodeDims[id].width, nodeDims[id].height));
      if (blocked) {
        const ys = grid.children.map(id => _gridPositions[id].y);
        const above = srcPos.y < Math.min(...ys);
        const entryY = above ? Math.min(...ys) - grid.cellH / 2 : Math.max(...ys) + grid.cellH / 2;
        const gapX = tgtPos.x - grid.cellW / 2;
        const start = boxEdge(srcPos, { x: gapX, y: entryY }, nodeDims[e.from].width, nodeDims[e.from].height);
        pts = [shapeEnd(start, srcPos, e.from), { x: gapX, y: entryY }, { x: gapX, y: tgtPos.y }, { x: tgtPos.x - tw_ / 2, y: tgtPos.y }];
        mid = { x: gapX, y: (entryY + tgtPos.y) / 2 };
      } else {
        const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        pts = [shapeEnd(a, srcPos, e.from), {x:mx,y:my}, shapeEnd(b, tgtPos, e.to)];
        mid = {x:mx, y:my};
      }
      d = smoothPath(pts);
    } else {
      const ed = g.edge(e.from, e.to, 'e' + i); if (!ed?.points?.length) return;
      pts = ed.points.slice();
      const group = !e.label && parallel[pairKey(e)];
      if (group && group.length > 1 && pts.length > 2) {
        const a = pts[0], b = pts[pts.length - 1], len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
        const off = (group.indexOf(e) - (group.length - 1) / 2) * 16;
        const nx = -(b.y - a.y) / len * off, ny = (b.x - a.x) / len * off;
        for (let k = 1; k < pts.length - 1; k++) pts[k] = { x: pts[k].x + nx, y: pts[k].y + ny };
      }
      pts[0] = shapeEnd(pts[0], srcPos, e.from);
      pts[pts.length - 1] = shapeEnd(pts[pts.length - 1], tgtPos, e.to);
      d = smoothPath(pts);
      mid = ed.x !== undefined ? {x: ed.x, y: ed.y} : pts[Math.floor(pts.length/2)];
    }
    const width = e.style === 'thick' ? 3.5 : 2;
    const dash = e.style === 'dotted' ? 'stroke-dasharray="3,4"' : '';
    const head = e.head && e.head !== 'none' ? `marker-end="url(#${uid}${e.head})"` : '';
    const tail = e.tail && e.tail !== 'none' ? `marker-start="url(#${uid}${e.tail})"` : '';
    const speed = iconBudget > 0 ? OmmViewer.edgeMotion(e, processFlowchart) : null;
    const pathId = speed ? ` id="${uid}p${i}"` : '';
    svg += `<path class="edge-path"${pathId} d="${d}" stroke="${ec}" stroke-width="${width}" fill="none" ${dash} ${head} ${tail} data-from="${esc(e.from)}" data-to="${esc(e.to)}"/>`;
    if (speed) edgeIcons += flowEdgeIcon(`${uid}p${i}`, pts, speed, i);
    if (e.label) {
      const lw = tw(e.label,'10px Inter')+12;
      const mx=r1(mid.x), my=r1(mid.y);
      edgeLabels += `<g class="edge-label"><rect x="${r1(mx-lw/2)}" y="${my-8}" width="${lw}" height="16" rx="3" fill="${th.edgeLabelBg}"/>
        <text x="${mx}" y="${my+3.5}" text-anchor="middle" font-family="Inter,system-ui" font-size="10" fill="${th.edgeLabelText}">${esc(e.label)}</text></g>`;
    }
  });
  svg += edgeIcons + edgeLabels;

  // nodes
  for (const n of nodes) {
    const pos = _gridPositions[n.id] || g.node(n.id); if (!pos) continue;
    const dim = nodeDims[n.id];
    const nx = r1(pos.x - dim.width/2);
    const ny = r1(pos.y - dim.height/2);
    const sg = subGroups[n.id];

    if (sg) {
      // ── sub-group: dashed boundary + nested content ──
      const safeId = esc(sg.cls); // short name for display
      const scopedId = esc(sg.scopedPath || sg.cls); // full path for selection
      const refSubStroke = th.subStroke;
      const fs = sg.fitScale;
      const PAD = 12;
      const boxW = sg.W * fs + PAD * 2, boxH = sg.H * fs + PAD * 2;
      const clipId = `${uid}clip_${n.id}`;
      svg += `<defs><clipPath id="${clipId}"><rect x="-2" y="-16" width="${r1(boxW+4)}" height="${r1(boxH+18)}" rx="6"/></clipPath></defs>`;
      svg += `<g class="grp-node" clip-path="url(#${clipId})" onclick="event.stopPropagation();window.__openSb('${scopedId}')" data-cls="${scopedId}" data-depth="${level+1}" transform="translate(${nx},${ny})">`;
      svg += `<rect class="grp-border" width="${r1(boxW)}" height="${r1(boxH)}" rx="5"
        fill="${th.subFill}" stroke="${refSubStroke}" stroke-width="2"/>`;
      const _slW = tw(fmtLabel(sg.cls), '600 9px "Plus Jakarta Sans",Inter,system-ui') + 12;
      svg += `<rect class="grp-label-top grp-label-bg" x="5" y="-7" width="${_slW}" height="14" rx="2" fill="${th.subFill}" opacity="1"/>`;
      svg += `<text class="grp-label-top" x="10" y="2" font-family="&quot;Plus Jakarta Sans&quot;,Inter,system-ui" font-size="9" font-weight="600"
        fill="${th.subLabelFill}" letter-spacing="0.05em">${esc(fmtLabel(sg.cls))}</text>`;
      svg += `<g class="grp-inner" transform="translate(${r1(PAD)},${r1(PAD)}) scale(${r1(fs)})">${sg.svgContent}</g>`;
      svg += `<text class="grp-label-center" x="${r1(boxW/2)}" y="${r1(boxH/2)}" text-anchor="middle" dominant-baseline="central"
        font-family="&quot;Plus Jakarta Sans&quot;,Inter,system-ui" font-size="9" font-weight="600" fill="${th.grpLabelCenterFill}" letter-spacing="0.05em">${esc(fmtLabel(sg.cls))}</text>`;
      svg += `</g>`;
      labelOverlay += `<text class="grp-label-center" x="${r1(nx + boxW/2)}" y="${r1(ny + boxH/2)}" text-anchor="middle" dominant-baseline="central"
        font-family="&quot;Plus Jakarta Sans&quot;,Inter,system-ui" font-size="9" font-weight="600" fill="${th.grpLabelCenterFill}" letter-spacing="0.05em">${esc(fmtLabel(sg.cls))}</text>`;
    } else {
      // ── regular node ──
      const st = nodeStyle(n, OmmViewer.flowNodeRole(n.shape, processFlowchart));
      const nodeScopedId = esc(scopedPath + '/' + n.id);
      const shape = flowShapeSvg(n.shape, nx, ny, dim.width, dim.height, st);
      const label = flowLabelSvg(dim.text, pos.x, pos.y, st, n.shape);
      svg += `<g class="reg-node flow-${n.shape}" data-cls="${nodeScopedId}" onclick="event.stopPropagation();window.__openSb('${nodeScopedId}')">${shape}${label}</g>`;
    }
  }

  return { svgContent: svg, W, H, labelOverlay };
}

// ── architecture (deployment) renderer ────────────────────
// architecture-beta: groups (where software runs) are nested dashed boxes, services (what
// runs there) are boxes with an icon, edges are the runtime connections. dagre lays it out;
// the T/B/L/R sides in the text only decide the main direction and which side an edge
// leaves from when that side faces the other end.

// 14px icon glyphs for Mermaid's built-in icons; other icons (iconify names) get a plain tile
function archIcon(name, cx, cy, color) {
  const a = `fill="none" stroke="${color}" stroke-width="1.3" stroke-linejoin="round"`;
  const x = r1(cx - 7), y = r1(cy - 7);
  switch ((name || '').toLowerCase()) {
    case 'server': return `<rect ${a} x="${x}" y="${r1(cy - 6)}" width="14" height="5" rx="1"/><rect ${a} x="${x}" y="${r1(cy + 1)}" width="14" height="5" rx="1"/><circle cx="${r1(cx + 4)}" cy="${r1(cy - 3.5)}" r="0.9" fill="${color}"/><circle cx="${r1(cx + 4)}" cy="${r1(cy + 3.5)}" r="0.9" fill="${color}"/>`;
    case 'database': return `<ellipse ${a} cx="${r1(cx)}" cy="${r1(cy - 4.5)}" rx="6" ry="2.5"/><path ${a} d="M${r1(cx - 6)},${r1(cy - 4.5)} V${r1(cy + 4.5)} A6,2.5 0 0 0 ${r1(cx + 6)},${r1(cy + 4.5)} V${r1(cy - 4.5)}"/>`;
    case 'disk': return `<circle ${a} cx="${r1(cx)}" cy="${r1(cy)}" r="6.5"/><circle ${a} cx="${r1(cx)}" cy="${r1(cy)}" r="2"/>`;
    case 'cloud': return `<path ${a} d="M${r1(cx - 4)},${r1(cy + 4)} H${r1(cx + 4.5)} A3,3 0 0 0 ${r1(cx + 4)},${r1(cy - 2)} A4.5,4.5 0 0 0 ${r1(cx - 4.5)},${r1(cy - 1)} A2.6,2.6 0 0 0 ${r1(cx - 4)},${r1(cy + 4)} Z"/>`;
    case 'internet': return `<circle ${a} cx="${r1(cx)}" cy="${r1(cy)}" r="6.5"/><ellipse ${a} cx="${r1(cx)}" cy="${r1(cy)}" rx="2.8" ry="6.5"/><path ${a} d="M${r1(cx - 6.5)},${r1(cy)} H${r1(cx + 6.5)}"/>`;
    default: return `<rect ${a} x="${x}" y="${y}" width="14" height="14" rx="3"/><path ${a} d="M${r1(cx - 3)},${r1(cy)} H${r1(cx + 3)} M${r1(cx)},${r1(cy - 3)} V${r1(cy + 3)}"/>`;
  }
}

function renderArchGroup(text, scopedPath) {
  const arch = OmmViewer.parseArchitectureDiagram(text);
  const services = [...arch.services.values()], junctions = [...arch.junctions.values()];
  if (!services.length) return null;
  const th = theme(), ec = th.edgeColor0;
  const PAD = 16, ICON_W = 22;
  const titleFont = '12px Inter,system-ui', groupFont = '600 10px Inter,system-ui';

  // Main direction: left to right unless most connections run top to bottom
  const vertical = arch.edges.filter(e => 'TB'.includes(e.fromSide) && 'TB'.includes(e.toSide)).length;
  const rankdir = vertical > arch.edges.length / 2 ? 'TB' : 'LR';

  const dims = {};
  for (const s of services) {
    const detail = cleanView ? null : s.detail;
    const w = Math.max(110, tw(s.title, titleFont) + ICON_W + 26, detail ? tw(detail, FLOW_PATH_FONT) + ICON_W + 26 : 0);
    dims[s.id] = { width: Math.min(260, w), height: detail ? 50 : 38, detail };
  }
  for (const j of junctions) dims[j.id] = { width: 10, height: 10 };

  const g = new dagre.graphlib.Graph({ multigraph: true, compound: arch.groups.size > 0 });
  g.setGraph({ rankdir, nodesep: 28, ranksep: 56, marginx: PAD, marginy: PAD + 6 });
  g.setDefaultEdgeLabel(() => ({}));
  for (const [id, d] of Object.entries(dims)) g.setNode(id, { width: d.width, height: d.height });
  for (const grp of arch.groups.values()) g.setNode('__grp_' + grp.id, { paddingTop: 22 });
  for (const grp of arch.groups.values()) if (grp.parent) g.setParent('__grp_' + grp.id, '__grp_' + grp.parent);
  for (const n of [...services, ...junctions]) if (n.parent) g.setParent(n.id, '__grp_' + n.parent);
  // Edges point along the main direction so the sides in the text shape the layout
  const forward = e => rankdir === 'LR' ? !(e.fromSide === 'L' || e.toSide === 'R') : !(e.fromSide === 'T' || e.toSide === 'B');
  arch.edges.forEach((e, i) => {
    const label = e.title ? { width: tw(e.title, '10px Inter') + 12, height: 16, labelpos: 'c' } : {};
    if (forward(e)) g.setEdge(e.from, e.to, label, 'e' + i); else g.setEdge(e.to, e.from, label, 'e' + i);
  });
  try { dagre.layout(g); } catch { return null; }
  const gi = g.graph();
  const W = r1(gi.width + PAD), H = r1(gi.height + PAD);
  const uid = 'ar' + Math.random().toString(36).slice(2, 7);

  let svg = `<defs>${arrowMarker(uid + 'a', ec)}</defs>`;
  // groups, outer first
  const groups = [...arch.groups.values()].sort((a, b) => OmmViewer.archGroupDepth(arch, a.id) - OmmViewer.archGroupDepth(arch, b.id));
  for (const grp of groups) {
    const box = g.node('__grp_' + grp.id);
    if (!box?.width) continue;
    const depth = OmmViewer.archGroupDepth(arch, grp.id);
    const gx = r1(box.x - box.width / 2), gy = r1(box.y - box.height / 2);
    const lw = tw(grp.title, groupFont) + (grp.icon ? 30 : 14);
    svg += `<g class="arch-group" data-group="${esc(grp.id)}">
      <rect x="${gx}" y="${gy}" width="${r1(box.width)}" height="${r1(box.height)}" rx="8" fill="${depth % 2 ? th.groupFill : th.subFill}" stroke="${th.subStroke}" stroke-width="1.5" stroke-dasharray="6,4"/>
      <rect x="${r1(gx + 10)}" y="${r1(gy - 9)}" width="${r1(lw)}" height="18" rx="3" fill="${th.subFill}" stroke="${th.subStroke}" stroke-width="1"/>
      ${grp.icon ? `<g transform="translate(${r1(gx + 22)},${r1(gy)}) scale(0.8)">${archIcon(grp.icon, 0, 0, th.subLabelFill)}</g>` : ''}
      <text x="${r1(gx + (grp.icon ? 33 : 17))}" y="${r1(gy)}" dominant-baseline="central" font-family="Inter,system-ui" font-size="10" font-weight="600" fill="${th.subLabelFill}">${esc(grp.title)}</text>
    </g>`;
  }

  // edges: from the side named in the text when it faces the other end
  const sidePoint = (c, w, h, side) => side === 'L' ? { x: c.x - w / 2, y: c.y } : side === 'R' ? { x: c.x + w / 2, y: c.y } : side === 'T' ? { x: c.x, y: c.y - h / 2 } : { x: c.x, y: c.y + h / 2 };
  const endBox = (id, inGroup) => {
    if (inGroup) { const b = g.node('__grp_' + arch.services.get(id).parent); if (b?.width) return b; }
    return g.node(id);
  };
  let edgeIcons = '', edgeLabels = '';
  arch.edges.forEach((e, i) => {
    const ed = g.edge(forward(e) ? e.from : e.to, forward(e) ? e.to : e.from, 'e' + i);
    if (!ed?.points?.length) return;
    let pts = ed.points.slice();
    if (!forward(e)) pts.reverse(); // now runs from e.from to e.to
    const a = endBox(e.from, e.fromGroup), b = endBox(e.to, e.toGroup);
    const faces = (box, side, toward) => {
      const p = sidePoint(box, box.width, box.height, side);
      return (p.x - box.x) * (toward.x - box.x) + (p.y - box.y) * (toward.y - box.y) > 0 ? p : null;
    };
    pts[0] = faces(a, e.fromSide, pts[1] ?? b) ?? (e.fromGroup ? boxEdge(a, pts[1] ?? b, a.width, a.height) : pts[0]);
    pts[pts.length - 1] = faces(b, e.toSide, pts[pts.length - 2] ?? a) ?? (e.toGroup ? boxEdge(b, pts[pts.length - 2] ?? a, b.width, b.height) : pts[pts.length - 1]);
    // draw in the direction of a single arrowhead, so the marker and moving icon agree
    const reverse = e.tail && !e.head;
    if (reverse) pts = pts.slice().reverse();
    const one = e.head !== e.tail;
    const head = one || e.head ? `marker-end="url(#${uid}a)"` : '';
    const tail = e.head && e.tail ? `marker-start="url(#${uid}a)"` : '';
    const speed = iconBudget > 0 ? OmmViewer.archEdgeMotion(e) : null;
    const pathId = speed ? ` id="${uid}p${i}"` : '';
    const src = reverse ? e.to : e.from, dst = reverse ? e.from : e.to;
    svg += `<path class="edge-path"${pathId} d="${smoothPath(pts)}" stroke="${ec}" stroke-width="2" fill="none" ${head} ${tail} data-from="${esc(src)}" data-to="${esc(dst)}"/>`;
    if (speed) edgeIcons += flowEdgeIcon(`${uid}p${i}`, pts, speed, i);
    if (e.title) {
      const mid = ed.x !== undefined ? { x: ed.x, y: ed.y } : pts[Math.floor(pts.length / 2)];
      const lw = tw(e.title, '10px Inter') + 12, mx = r1(mid.x), my = r1(mid.y);
      edgeLabels += `<g class="edge-label"><rect x="${r1(mx - lw / 2)}" y="${my - 8}" width="${lw}" height="16" rx="3" fill="${th.edgeLabelBg}"/>
        <text x="${mx}" y="${my + 3.5}" text-anchor="middle" font-family="Inter,system-ui" font-size="10" fill="${th.edgeLabelText}">${esc(e.title)}</text></g>`;
    }
  });
  svg += edgeIcons + edgeLabels;

  // services and junctions
  for (const s of services) {
    const p = g.node(s.id), d = dims[s.id];
    if (!p) continue;
    const st = nodeStyle(s, OmmViewer.archServiceRole(s.icon));
    const x = r1(p.x - d.width / 2), y = r1(p.y - d.height / 2);
    // text centred in the space right of the icon (the zoom code enlarges .node-lbl around its centre)
    const ix = p.x - d.width / 2 + 16, tx = r1(p.x + ICON_W / 2);
    const nodeScopedId = esc(scopedPath + '/' + s.id);
    const icon = s.iconText
      ? `<text x="${r1(ix)}" y="${r1(p.y)}" text-anchor="middle" dominant-baseline="central" font-size="12" fill="${st.text}">${esc(s.iconText)}</text>`
      : archIcon(s.icon, ix, p.y, st.text);
    const titleY = d.detail ? p.y - 7 : p.y;
    svg += `<g class="reg-node arch-service" data-cls="${nodeScopedId}" onclick="event.stopPropagation();window.__openSb('${nodeScopedId}')">
      <rect class="nshape" x="${x}" y="${y}" width="${r1(d.width)}" height="${r1(d.height)}" rx="6" fill="${st.bg}" stroke="${st.border}" stroke-width="2"${st.dash ? ` stroke-dasharray="${st.dash}"` : ''}/>
      ${icon}
      <text class="node-lbl" x="${tx}" y="${r1(titleY)}" text-anchor="middle" dominant-baseline="central" font-family="Inter,system-ui,sans-serif" font-size="12" fill="${st.text}">${esc(s.title)}</text>
      ${d.detail ? `<text class="node-path" x="${tx}" y="${r1(p.y + 9)}" text-anchor="middle" dominant-baseline="central" font-family="'SF Mono','Fira Code',monospace" font-size="9" fill="${st.text}" opacity="0.55">${esc(d.detail)}</text>` : ''}
    </g>`;
  }
  for (const j of junctions) {
    const p = g.node(j.id);
    if (p) svg += `<circle cx="${r1(p.x)}" cy="${r1(p.y)}" r="4" fill="${ec}"/>`;
  }

  return { svgContent: svg, W, H, labelOverlay: '' };
}

// ── ER diagram renderer ───────────────────────────────────
// Entities are boxes with a header and one row per attribute; relationships are
// lines (dashed = non-identifying) with cardinality text at both ends.
const ER_KEY_COLORS = { PK: '#d4a017', FK: '#60a5fa', UK: '#a78bfa' };

function renderErGroup(text, scopedPath) {
  const er = OmmViewer.parseErDiagram(text);
  const entities = [...er.entities.values()];
  if (!entities.length) return null;

  const PAD_L = 16, PAD_R = 20, PAD_T = 20, PAD_B = 16;
  const HEAD_H = 26, ROW_H = 18, CELL_PAD = 10;
  const th = theme();
  const st = nodeStyle({}), hd = nodeStyle({}, 'entity'); // hd: entity header (same as st in monochrome)
  const headFont = '600 12px Inter,system-ui', rowFont = '11px Inter,system-ui', monoFont = "10px 'SF Mono','Fira Code',monospace";

  // Measure entity boxes
  const dims = {};
  for (const ent of entities) {
    const title = ent.alias || ent.name;
    let keyW = 0, nameW = 0, typeW = 0;
    for (const a of ent.attributes) {
      if (a.keys.length) keyW = Math.max(keyW, tw(a.keys.join(','), '600 9px Inter,system-ui') + 6);
      nameW = Math.max(nameW, tw(a.name, rowFont));
      typeW = Math.max(typeW, tw(a.type, monoFont));
    }
    const bodyW = (keyW ? keyW + 6 : 0) + nameW + (typeW ? typeW + 16 : 0);
    const width = Math.max(110, tw(title, headFont) + CELL_PAD * 2, bodyW + CELL_PAD * 2);
    const height = HEAD_H + (ent.attributes.length ? ent.attributes.length * ROW_H + 6 : 0);
    dims[ent.name] = { width, height, keyW, typeW };
  }

  const g = new dagre.graphlib.Graph({ multigraph: true });
  const rankdir = er.direction === 'BT' || er.direction === 'RL' || er.direction === 'LR' ? er.direction : 'TB';
  g.setGraph({ rankdir, nodesep: 40, ranksep: 70, marginx: PAD_L, marginy: PAD_T });
  g.setDefaultEdgeLabel(() => ({}));
  for (const ent of entities) g.setNode(ent.name, { width: dims[ent.name].width, height: dims[ent.name].height });
  er.relationships.forEach((r, i) => {
    g.setEdge(r.from, r.to, { label: r.label, width: tw(r.label, '9px Inter') + 8, height: 12 }, 'r' + i);
  });
  try { dagre.layout(g); } catch { return null; }

  const gi = g.graph();
  const W = r1(gi.width + PAD_R), H = r1(gi.height + PAD_B);
  let svg = '';

  // Relationships; their text is drawn after every line, so no line runs over it
  let relLabels = '';
  er.relationships.forEach((r, i) => {
    const ed = g.edge(r.from, r.to, 'r' + i);
    if (!ed?.points?.length) return;
    const pts = ed.points;
    const d = smoothPath(pts);
    const dash = r.identifying ? '' : 'stroke-dasharray="5,4"';
    svg += `<path class="edge-path" d="${d}" stroke="${th.edgeColor0}" stroke-width="2" fill="none" ${dash} data-from="${esc(r.from)}" data-to="${esc(r.to)}"/>`;
    // Cardinality text just outside each entity, nudged sideways off the line
    const endLabel = (p, q, marker) => {
      const dx = q.x - p.x, dy = q.y - p.y, len = Math.hypot(dx, dy) || 1;
      const x = r1(p.x + (dx / len) * 20 + (-dy / len) * 11), y = r1(p.y + (dy / len) * 20 + (dx / len) * 11);
      return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="central" font-family="Inter,system-ui" font-size="9" font-weight="600" fill="${th.edgeLabelText}">${esc(OmmViewer.cardinalityText(marker))}</text>`;
    };
    relLabels += endLabel(pts[0], pts[1], r.fromCard);
    relLabels += endLabel(pts[pts.length - 1], pts[pts.length - 2], r.toCard);
    if (r.label) {
      const mid = pts[Math.floor(pts.length / 2)];
      const lw = tw(r.label, '9px Inter') + 8, mx = r1(mid.x), my = r1(mid.y);
      relLabels += `<g class="edge-label"><rect x="${mx - lw / 2}" y="${my - 6}" width="${lw}" height="12" rx="2" fill="${th.edgeLabelBg}"/>
        <text x="${mx}" y="${my + 3}" text-anchor="middle" font-family="Inter,system-ui" font-size="9" fill="${th.edgeLabelText}">${esc(r.label)}</text></g>`;
    }
  });
  svg += relLabels;

  // Entities
  for (const ent of entities) {
    const pos = g.node(ent.name); if (!pos) continue;
    const { width: w, height: h, keyW, typeW } = dims[ent.name];
    const x = r1(pos.x - w / 2), y = r1(pos.y - h / 2);
    const id = esc(scopedPath + '/' + ent.name);
    let body = `<rect class="nshape" x="${x}" y="${y}" width="${r1(w)}" height="${r1(h)}" rx="4" fill="${st.bg}" stroke="${hd.border}" stroke-width="2"/>`;
    // Color mode: tinted header band (rows stay neutral)
    if (hd.bg !== st.bg) body += `<path d="M${r1(x + 1)},${r1(y + HEAD_H)} V${r1(y + 4)} Q${r1(x + 1)},${r1(y + 1)} ${r1(x + 4)},${r1(y + 1)} H${r1(x + w - 4)} Q${r1(x + w - 1)},${r1(y + 1)} ${r1(x + w - 1)},${r1(y + 4)} V${r1(y + HEAD_H)} Z" fill="${hd.bg}"/>`;
    body += `<path d="M${x},${r1(y + HEAD_H)} H${r1(x + w)}" stroke="${hd.border}" stroke-width="1"/>`;
    body += `<text class="node-lbl" x="${r1(pos.x)}" y="${r1(y + HEAD_H / 2)}" text-anchor="middle" dominant-baseline="central" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="${hd.text}">${esc(ent.alias || ent.name)}</text>`;
    ent.attributes.forEach((a, i) => {
      const ry = r1(y + HEAD_H + 3 + ROW_H * i + ROW_H / 2);
      let cx = x + CELL_PAD;
      if (keyW) {
        if (a.keys.length) {
          const color = ER_KEY_COLORS[a.keys[0]] || th.edgeLabelText;
          body += `<text x="${r1(cx)}" y="${ry}" dominant-baseline="central" font-family="Inter,system-ui" font-size="9" font-weight="600" fill="${color}">${esc(a.keys.join(','))}</text>`;
        }
        cx += keyW + 6;
      }
      const title = a.comment ? `<title>${esc(a.comment)}</title>` : '';
      body += `<text x="${r1(cx)}" y="${ry}" dominant-baseline="central" font-family="Inter,system-ui" font-size="11" fill="${st.text}">${title}${esc(a.name)}</text>`;
      if (typeW) {
        body += `<text x="${r1(x + w - CELL_PAD)}" y="${ry}" text-anchor="end" dominant-baseline="central" font-family="'SF Mono','Fira Code',monospace" font-size="10" fill="${st.text}" opacity="0.5">${esc(a.type)}</text>`;
      }
    });
    svg += `<g class="reg-node er-entity" data-cls="${id}" onclick="event.stopPropagation();window.__openSb('${id}')">${body}</g>`;
  }

  return { svgContent: svg, W, H, labelOverlay: '' };
}

// ── Sequence diagram renderer ─────────────────────────────
// Participants are columns with lifelines; messages are arrows drawn top to bottom in
// order. Columns are pushed apart until every message label fits. Blocks (loop, alt, …)
// are labelled frames around what they contain; `rect` is a tinted band.
const SEQ_SAFE_COLOR = /^(rgba?\([\d\s.,%]+\)|#[0-9a-f]{3,8}|[a-z]+)$/i;

function renderSeqGroup(text, scopedPath) {
  const seq = OmmViewer.parseSequenceDiagram(text);
  const parts = [...seq.participants.values()];
  if (!parts.length) return null;

  const PAD_L = 16, PAD_R = 20, PAD_T = 16, PAD_B = 16;
  const HEAD_H = 34, GAP = 36, SELF_W = 30, NOTE_PAD = 8, ACT_W = 10;
  const th = theme(), st = nodeStyle({}), ec = th.edgeColor0;
  // Color mode: participants, activation bars and notes get their own colors
  // (in monochrome these equal st, or the shared note tokens)
  const pst = nodeStyle({}, 'participant'), ast = nodeStyle({}, 'activation');
  const noteSt = colorMode === 'color' ? nodeStyle({}, 'note') : { bg: th.subFill, border: th.subStroke };
  const msgFont = '11px Inter,system-ui', headFont = '600 12px Inter,system-ui';
  const name = p => p.label || p.id;

  // Column centres: start from the header widths, then widen gaps for labels
  const idx = {};
  parts.forEach((p, i) => { idx[p.id] = i; });
  const colW = parts.map(p => Math.max(90, tw(name(p), headFont) + 28));
  const gaps = parts.map((_, i) => (i ? (colW[i - 1] + colW[i]) / 2 + GAP : 0));
  const needs = [];
  for (const e of seq.events) {
    if (e.kind === 'message') {
      const a = idx[e.from], b = idx[e.to];
      const w = tw(e.text, msgFont) + 24 + (seq.autonumber ? 20 : 0);
      if (a !== b) needs.push([Math.min(a, b), Math.max(a, b), w]);
      else if (a + 1 < parts.length) needs.push([a, a + 1, w + SELF_W]);
    } else if (e.kind === 'note' && e.placement !== 'over') {
      const a = idx[e.participants[0]], w = tw(e.text, msgFont) + NOTE_PAD * 2 + 16;
      if (e.placement === 'right of' && a + 1 < parts.length) needs.push([a, a + 1, w]);
      if (e.placement === 'left of' && a > 0) needs.push([a - 1, a, w]);
    }
  }
  needs.sort((p, q) => (p[1] - p[0]) - (q[1] - q[0]));
  for (const [a, b, w] of needs) {
    let span = 0;
    for (let i = a + 1; i <= b; i++) span += gaps[i];
    if (span < w) gaps[b] += w - span;
  }
  const cx = [];
  gaps.reduce((acc, g, i) => (cx[i] = acc + g), 0);
  const X = id => cx[idx[id]];

  // Horizontal extent of everything drawn, so the group can be shifted and sized at the end
  let minX = Infinity, maxX = -Infinity;
  const blocks = [];
  const touch = (a, b) => {
    minX = Math.min(minX, a, b); maxX = Math.max(maxX, a, b);
    for (const bl of blocks) { bl.minX = Math.min(bl.minX, a, b); bl.maxX = Math.max(bl.maxX, a, b); }
  };
  parts.forEach((p, i) => { minX = Math.min(minX, cx[i] - colW[i] / 2); maxX = Math.max(maxX, cx[i] + colW[i] / 2); });

  // Activations: a stack of start y per participant
  const active = {}, actBoxes = [];
  const depth = id => (active[id] || []).length;
  const startAct = (id, y) => (active[id] = active[id] || []).push(y);
  const stopAct = (id, y) => {
    const s = active[id];
    if (s?.length) actBoxes.push({ x: X(id) - ACT_W / 2 + (s.length - 1) * 4, y1: s.pop(), y2: y });
  };
  // Where a message leaves or reaches a lifeline: the edge of the innermost activation bar
  const edgeX = (id, right) => {
    const d = depth(id);
    return d ? X(id) + (d - 1) * 4 + (right ? ACT_W / 2 : -ACT_W / 2) : X(id);
  };

  const uid = 'sq' + Math.random().toString(36).slice(2, 7);
  const defs = `<defs>${arrowMarker(uid + 'f', ec)}${arrowMarker(uid + 'a', ec, true)}</defs>`;
  // `extra` may override fill and font-size; an attribute must not appear twice (exported SVG is strict XML)
  const text_ = (x, y, s, anchor = 'middle', extra = '') => {
    const size = /\bfont-size=/.test(extra) ? '' : 'font-size="11"';
    const fill = /\bfill=/.test(extra) ? '' : `fill="${st.text}"`;
    return `<text x="${r1(x)}" y="${r1(y)}" text-anchor="${anchor}" dominant-baseline="central" font-family="Inter,system-ui" ${size} ${fill} ${extra}>${esc(s)}</text>`;
  };

  let bands = '', frames = '', fore = '';
  const moving = []; // messages that get a moving icon, in diagram order
  let y = PAD_T + HEAD_H + 12; // top of the next row
  let num = 0;

  for (const e of seq.events) {
    if (e.kind === 'message') {
      const style = OmmViewer.messageStyle(e.arrow);
      const self = e.from === e.to;
      const right = self || X(e.to) >= X(e.from);
      const ly = y + 20;
      const x1 = edgeX(e.from, right);
      if (e.activate) startAct(e.to, ly);
      const x2 = self ? edgeX(e.to, true) : edgeX(e.to, !right);
      const dash = style.dashed ? 'stroke-dasharray="5,4"' : '';
      const head = style.head === 'filled' ? `marker-end="url(#${uid}f)"` : style.head === 'async' ? `marker-end="url(#${uid}a)"` : '';
      const tail = style.bidirectional ? `marker-start="url(#${uid}f)"` : '';
      const d = self ? `M${r1(x1)},${ly} H${r1(x1 + SELF_W)} V${ly + 14} H${r1(x2)}` : `M${r1(x1)},${ly} H${r1(x2)}`;
      const pathId = iconBudget > 0 ? `${uid}m${moving.length}` : '';
      if (pathId) moving.push({ pathId, len: self ? SELF_W * 2 + 14 : Math.abs(x2 - x1), start: seq.autonumber ? 10 : 0 });
      fore += `<path class="edge-path"${pathId ? ` id="${pathId}"` : ''} d="${d}" stroke="${ec}" stroke-width="1.5" fill="none" ${dash} ${head} ${tail} data-from="${esc(e.from)}" data-to="${esc(e.to)}"/>`;
      if (style.head === 'cross') {
        const cx2 = self ? x2 : x2 + (right ? -4 : 4), cy2 = self ? ly + 14 : ly;
        fore += `<path d="M${r1(cx2 - 4)},${cy2 - 4} L${r1(cx2 + 4)},${cy2 + 4} M${r1(cx2 - 4)},${cy2 + 4} L${r1(cx2 + 4)},${cy2 - 4}" stroke="${ec}" stroke-width="1.5"/>`;
      }
      const label = e.text, lx = self ? x1 + (seq.autonumber ? 12 : 4) : (x1 + x2) / 2;
      if (seq.autonumber) {
        num++;
        fore += `<circle cx="${r1(x1)}" cy="${ly}" r="8" fill="${ec}"/>` + text_(x1, ly, String(num), 'middle', `font-size="9" font-weight="600" fill="${th.edgeLabelBg}"`);
      }
      const lw = tw(label, msgFont);
      fore += self ? text_(lx, y + 9, label, 'start') : text_(lx, y + 9, label);
      touch(Math.min(x1, x2, self ? lx : lx - lw / 2), Math.max(x1, x2, self ? Math.max(x1 + SELF_W, lx + lw) : lx + lw / 2));
      if (e.deactivate) stopAct(e.from, ly);
      y += self ? 50 : 36;
    } else if (e.kind === 'note') {
      const w = tw(e.text, msgFont) + NOTE_PAD * 2;
      let nx1;
      if (e.placement === 'over') {
        const xs = e.participants.map(X), a = Math.min(...xs), b = Math.max(...xs);
        const nw = Math.max(w, b - a + 40);
        nx1 = (a + b) / 2 - nw / 2;
        fore += `<rect x="${r1(nx1)}" y="${y + 4}" width="${r1(nw)}" height="26" rx="3" fill="${noteSt.bg}" stroke="${noteSt.border}" stroke-width="1"/>`;
        fore += text_(nx1 + nw / 2, y + 17, e.text);
        touch(nx1, nx1 + nw);
      } else {
        const px = X(e.participants[0]);
        nx1 = e.placement === 'right of' ? px + 10 : px - 10 - w;
        fore += `<rect x="${r1(nx1)}" y="${y + 4}" width="${r1(w)}" height="26" rx="3" fill="${noteSt.bg}" stroke="${noteSt.border}" stroke-width="1"/>`;
        fore += text_(nx1 + w / 2, y + 17, e.text);
        touch(nx1, nx1 + w);
      }
      y += 38;
    } else if (e.kind === 'activate') {
      startAct(e.participant, y + 4);
    } else if (e.kind === 'deactivate') {
      stopAct(e.participant, y + 4);
    } else if (e.kind === 'block') {
      blocks.push({ type: e.type, label: e.label, top: y + 4, minX: Infinity, maxX: -Infinity, branches: [] });
      y += e.type === 'rect' ? 10 : 30;
    } else if (e.kind === 'branch') {
      blocks[blocks.length - 1]?.branches.push({ y: y + 4, label: e.label });
      y += 26;
    } else if (e.kind === 'end') {
      const bl = blocks.pop();
      if (!bl) continue;
      if (bl.minX === Infinity) { bl.minX = cx[0]; bl.maxX = cx[cx.length - 1]; }
      const bottom = y + 4;
      if (bl.type === 'rect') {
        const fill = SEQ_SAFE_COLOR.test(bl.label) ? bl.label : th.subFill;
        const x1 = bl.minX - 8, x2 = bl.maxX + 8;
        bands += `<rect x="${r1(x1)}" y="${bl.top}" width="${r1(x2 - x1)}" height="${bottom - bl.top}" fill="${esc(fill)}" fill-opacity="0.18" rx="3"/>`;
        touch(x1, x2);
        y += 10;
        continue;
      }
      const tabW = tw(bl.type, '600 10px Inter,system-ui') + 14;
      const condW = bl.label ? tw(`[${bl.label}]`, msgFont) + 12 : 0;
      const x1 = bl.minX - 12, x2 = Math.max(bl.maxX + 12, x1 + tabW + condW + 12);
      frames += `<rect x="${r1(x1)}" y="${bl.top}" width="${r1(x2 - x1)}" height="${bottom - bl.top}" fill="none" stroke="${th.subStroke}" stroke-width="1" rx="2"/>`;
      frames += `<path d="M${r1(x1)},${bl.top} h${tabW} v12 l-6,6 H${r1(x1)} z" fill="${th.subFill}" stroke="${th.subStroke}" stroke-width="1"/>`;
      frames += `<text x="${r1(x1 + 6)}" y="${bl.top + 9}" dominant-baseline="central" font-family="Inter,system-ui" font-size="10" font-weight="600" fill="${th.subLabelFill}">${esc(bl.type)}</text>`;
      if (bl.label) frames += text_(x1 + tabW + 8, bl.top + 9, `[${bl.label}]`, 'start', `fill="${th.edgeLabelText}"`);
      for (const br of bl.branches) {
        frames += `<path d="M${r1(x1)},${br.y} H${r1(x2)}" stroke="${th.subStroke}" stroke-width="1" stroke-dasharray="4,3"/>`;
        if (br.label) frames += text_(x1 + 8, br.y + 11, `[${br.label}]`, 'start', `fill="${th.edgeLabelText}"`);
      }
      touch(x1, x2); // widens any enclosing block
      y += 16;
    }
  }

  const bottom = y + 6;
  for (const id of Object.keys(active)) while (active[id].length) stopAct(id, bottom);

  // Lifelines, activation bars and participant headers
  let lanes = '', heads = '';
  parts.forEach((p, i) => {
    const x = cx[i], w = colW[i];
    const pid = esc(scopedPath + '/' + p.id);
    lanes += `<path d="M${r1(x)},${PAD_T + HEAD_H} V${bottom}" stroke="${th.subStroke}" stroke-width="1" stroke-dasharray="3,3"/>`;
    let shape;
    if (p.kind === 'actor') {
      const t = PAD_T;
      shape = `<rect x="${r1(x - w / 2)}" y="${t}" width="${r1(w)}" height="${HEAD_H}" fill="transparent"/>
        <g stroke="${pst.border}" stroke-width="1.5" fill="none"><circle cx="${r1(x)}" cy="${t + 5}" r="4.5"/>
        <path d="M${r1(x)},${t + 9.5} V${t + 17} M${r1(x - 7)},${t + 12.5} H${r1(x + 7)} M${r1(x)},${t + 17} l-5,6 M${r1(x)},${t + 17} l5,6"/></g>
        <text class="node-lbl" x="${r1(x)}" y="${t + 30}" text-anchor="middle" dominant-baseline="central" font-family="Inter,system-ui,sans-serif" font-size="11" font-weight="600" fill="${st.text}">${esc(name(p))}</text>`;
    } else {
      shape = `<rect class="nshape" x="${r1(x - w / 2)}" y="${PAD_T}" width="${r1(w)}" height="${HEAD_H}" rx="4" fill="${pst.bg}" stroke="${pst.border}" stroke-width="2"/>
        <text class="node-lbl" x="${r1(x)}" y="${PAD_T + HEAD_H / 2}" text-anchor="middle" dominant-baseline="central" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="600" fill="${pst.text}">${esc(name(p))}</text>`;
    }
    heads += `<g class="reg-node seq-participant" data-cls="${pid}" onclick="event.stopPropagation();window.__openSb('${pid}')">${shape}</g>`;
  });
  const bars = actBoxes.map(b => `<rect x="${r1(b.x)}" y="${r1(b.y1)}" width="${ACT_W}" height="${r1(Math.max(6, b.y2 - b.y1))}" fill="${ast.bg}" stroke="${ast.border}" stroke-width="1.5"/>`).join('');

  const dx = PAD_L - minX;
  const W = r1(maxX - minX + PAD_L + PAD_R), H = r1(bottom + PAD_B);
